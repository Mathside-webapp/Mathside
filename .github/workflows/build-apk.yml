name: Build Mathside Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Optional: configure both as repository Actions secrets instead of putting
      # frontend-safe values in js/config.js. Never use service_role or R2 secrets.
      MATHSIDE_SUPABASE_URL: ${{ secrets.MATHSIDE_SUPABASE_URL }}
      MATHSIDE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MATHSIDE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out Mathside source
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK (fixed for removed tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Mathside web features
        run: npm test

      - name: Bundle web assets for Android
        run: npm run build:web

      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/apply-android-branding.mjs

      - name: Assemble Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Save Mathside APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mathside-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
